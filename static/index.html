<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tax Document Classifier</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --error: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: 2rem;
      line-height: 1.5;
    }
    .container { max-width: 42rem; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background: var(--surface);
      transition: border-color 0.2s, background 0.2s;
    }
    .zone.dragover { border-color: var(--accent); background: rgba(88, 166, 255, 0.06); }
    .zone input[type="file"] {
      position: absolute;
      width: 0; height: 0;
      opacity: 0;
      overflow: hidden;
    }
    .zone label {
      cursor: pointer;
      color: var(--accent);
      text-decoration: underline;
      font-weight: 500;
    }
    .zone label:hover { opacity: 0.9; }
    .zone p { margin: 0.5rem 0; color: var(--muted); font-size: 0.9rem; }
    .status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .status.loading { background: rgba(88, 166, 255, 0.12); color: var(--accent); }
    .status.error { background: rgba(248, 81, 73, 0.12); color: var(--error); }
    .status.success { background: rgba(63, 185, 80, 0.12); color: var(--success); }
    .results { margin-top: 1.5rem; }
    .results h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem; }
    .form-list {
      list-style: none;
      padding: 0;
      margin: 0 0 1rem 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .form-list li {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .form-list li:last-child { border-bottom: none; }
    .form-list .name { font-weight: 500; }
    .form-list .pages { color: var(--muted); font-size: 0.9rem; }
    .json-block {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 0.5rem;
    }
    .json-block pre {
      margin: 0;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .copy-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn:hover { background: var(--border); }
    .btn.copy { border-color: var(--accent); color: var(--accent); }
    .btn.copy:hover { background: rgba(88, 166, 255, 0.15); }
    .btn.copied { border-color: var(--success); color: var(--success); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tax Document Classifier</h1>
    <p class="sub">Upload a PDF to detect form types (e.g. Form 1040, Schedule A) per page range.</p>

    <div class="zone" id="zone">
      <input type="file" id="file" accept=".pdf,application/pdf" aria-label="Choose PDF file">
      <label for="file">Choose a PDF file</label>
      <p>or drag and drop a PDF here</p>
    </div>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <div id="results" class="results" hidden>
      <h2>Detected forms</h2>
      <ul class="form-list" id="formList"></ul>
      <h2>JSON</h2>
      <div class="json-block">
        <pre id="jsonPre"></pre>
        <div class="copy-wrap">
          <button type="button" class="btn copy" id="copyBtn">Copy JSON</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const fileInput = document.getElementById('file');
      const zone = document.getElementById('zone');
      const statusEl = document.getElementById('status');
      const resultsEl = document.getElementById('results');
      const formList = document.getElementById('formList');
      const jsonPre = document.getElementById('jsonPre');
      const copyBtn = document.getElementById('copyBtn');

      function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className = 'status ' + type;
        statusEl.hidden = false;
      }

      function hideStatus() {
        statusEl.hidden = true;
      }

      function showResults(data) {
        const forms = data.forms || [];
        formList.innerHTML = forms.map(function (f) {
          const pages = f.start_page === f.end_page
            ? 'Page ' + f.start_page
            : 'Pages ' + f.start_page + '–' + f.end_page;
          return '<li><span class="name">' + escapeHtml(f.document_type) + '</span><span class="pages">' + pages + '</span></li>';
        }).join('');
        jsonPre.textContent = JSON.stringify(data, null, 2);
        resultsEl.hidden = false;
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function upload(file) {
        if (!file || !file.name.toLowerCase().endsWith('.pdf')) {
          showStatus('Please select a PDF file.', 'error');
          return;
        }
        resultsEl.hidden = true;
        showStatus('Classifying…', 'loading');
        const formData = new FormData();
        formData.append('file', file);
        fetch('/classify', {
          method: 'POST',
          body: formData
        })
          .then(function (res) {
            if (!res.ok) return res.json().then(function (d) { throw new Error(d.detail || res.statusText); });
            return res.json();
          })
          .then(function (data) {
            hideStatus();
            showStatus('Done.', 'success');
            showResults(data);
          })
          .catch(function (err) {
            showStatus(err.message || 'Upload failed.', 'error');
          });
      }

      fileInput.addEventListener('change', function () {
        const f = fileInput.files && fileInput.files[0];
        if (f) upload(f);
        fileInput.value = '';
      });

      zone.addEventListener('dragover', function (e) {
        e.preventDefault();
        zone.classList.add('dragover');
      });
      zone.addEventListener('dragleave', function () {
        zone.classList.remove('dragover');
      });
      zone.addEventListener('drop', function (e) {
        e.preventDefault();
        zone.classList.remove('dragover');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f && f.type === 'application/pdf') upload(f);
        else showStatus('Please drop a PDF file.', 'error');
      });

      copyBtn.addEventListener('click', function () {
        const text = jsonPre.textContent;
        navigator.clipboard.writeText(text).then(function () {
          copyBtn.textContent = 'Copied!';
          copyBtn.classList.add('copied');
          setTimeout(function () {
            copyBtn.textContent = 'Copy JSON';
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });
    })();
  </script>
</body>
</html>
